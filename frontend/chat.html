<!DOCTYPE html>
<html>
  <head>
    <title>Chat</title>
    <style>
      body {
        font-family: Arial;
        background: #f4f4f4;
      }
      .box {
        width: 400px;
        margin: 20px auto;
        background: white;
        padding: 10px;
        border-radius: 6px;
      }
      .messages {
        height: 250px;
        border: 1px solid #ccc;
        overflow-y: auto;
        padding: 6px;
      }
      .msg {
        margin: 4px 0;
        padding: 6px;
        background: #e3e3ff;
        border-radius: 4px;
      }
      textarea,
      button {
        width: 100%;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h3 id="title"></h3>
      <div class="messages" id="messages"></div>
      <textarea id="message" placeholder="Type message"></textarea>
      <button onclick="sendMessage()">Send</button>
    </div>

    <script>
      const API = "http://localhost:3000/api/chat";
      const user = JSON.parse(localStorage.getItem("user"));
      const friend = JSON.parse(localStorage.getItem("chatFriend"));

      if (!user || !friend) window.location.href = "login.html";

      document.getElementById("title").innerText = `Chat with ${friend.name}`;

      const chatId = `${user.userId}_${friend.id}`;

      async function loadMessages() {
        const res = await fetch(`${API}/${chatId}`);
        const data = await res.json();

        const box = document.getElementById("messages");
        box.innerHTML = "";

        data.forEach((m) => {
          const div = document.createElement("div");
          div.className = "msg";
          div.innerText = m.message;
          box.appendChild(div);
        });
      }

      async function sendMessage() {
        const text = document.getElementById("message").value;

        await fetch(`${API}/send`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            senderId: user.userId,
            receiverId: friend.id,
            message: text,
          }),
        });

        document.getElementById("message").value = "";
        loadMessages();
      }

      loadMessages();
    </script>
  </body>
</html>
